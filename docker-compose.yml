# Local hospital Postgres (rural on-prem). App runs on the host or in the optional `app` service.
# Set POSTGRES_PASSWORD in a .env file next to this compose file (never commit it).
services:
  db:
    image: postgres:16.10-alpine
    container_name: patient-monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: patient_monitor
    # Loopback only: the database must never be reachable from the ward Wi-Fi.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pm} -d patient_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the Next.js app inside Docker after `npm run build` on the host
  # or build with the Dockerfile. Prefer host `npm run start:lan` on Windows hospital PCs.
  # app:
  #   build: .
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports:
  #     - "3000:3000"
  #   env_file: .env

volumes:
  pm_pgdata:
